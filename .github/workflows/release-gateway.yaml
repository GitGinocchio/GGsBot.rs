name: Build and Release Gateway

on:
  push:
    branches: [master, main]
    paths:
      - 'gateway/**'
      - 'Cargo.lock'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Rimosso il default globale
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install MUSL Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        # Qui non serve specificare nulla perché l'action 
        # troverà il Cargo.lock nella root di default

      - name: Get Short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build
        # Specifichiamo la directory solo per il build
        working-directory: ./gateway
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.slug.outputs.sha8 }}
          name: Gateway release ${{ steps.slug.outputs.sha8 }}
          files: |
            # Ora i percorsi sono relativi alla ROOT del progetto (molto più semplice!)
            target/x86_64-unknown-linux-musl/release/gateway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}