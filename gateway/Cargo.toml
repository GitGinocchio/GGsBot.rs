[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
twilight = "0.17.1"
twilight-gateway = { version = "0.17.1", default-features = true }
twilight-model = "0.17.1"

dotenv = "0.15.0"
reqwest = { version = "0.13.3", features = [ "json", "rustls" ] }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.102"
