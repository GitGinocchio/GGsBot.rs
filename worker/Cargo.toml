[package]
name = "ggsbotrs"
version = "0.1.0"
authors = ["GitGinocchio <106624847+GitGinocchio@users.noreply.github.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
cfg-if = "1.0.4"
 
worker = { version = "0.8.5", features = [ "queue" ] }
flarecord = { path = "../../flarecordrs/" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.1", optional = true }

[profile.release]
opt-level = "z"     # Ottimizza specificamente per la dimensione del file
lto = true          # Link Time Optimization (rimuove codice morto tra le crate)
codegen-units = 1   # Migliora l'ottimizzazione a scapito del tempo di compilazione
panic = "abort"     # Rimuove l'infrastruttura per l'unwinding dei panic
strip = true        # Rimuove tutti i simboli di debug (fondamentale!)
