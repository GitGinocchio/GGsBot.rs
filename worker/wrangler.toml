name = "ggsbotrs"
workers_dev = true
compatibility_date = "2026-04-14"

main = "build/index.js"

[vars]
WORKER_ENV = "production"
DISCORD_DEVELOPER_ID = "778017089230209045"

[env.production.vars]
WORKER_ENV = "production"
DISCORD_DEVELOPER_ID = "778017089230209045"

[env.local.vars]
WORKER_ENV = "dev"
DISCORD_DEVELOPER_ID = "778017089230209045"

[env.local.build]
command = "cargo install -q worker-build && worker-build --release" # required

[env.production.version_metadata]
binding = "metadata"

[[env.production.kv_namespaces]]
binding = "ggsbotkv"
id = "c1c5302906b04ad1af9c6f87b80f1367"

[env.production.triggers]
crons = [
  "0 7 * * *"
]

# Modificare questa coda in modo che diventi una coda generica "tasks"
# nel quale il bot inserisce delle azioni che dovra' fare in futuro
[[env.production.queues.producers]]
binding = "APOD_QUEUE"
queue = "ggsbotrs-apod-queue"
#delivery_delay = 60

[[env.production.queues.consumers]]
queue = "ggsbotrs-apod-queue"
max_batch_size = 10
max_batch_timeout = 0
max_retries = 3
max_concurrency = 2
retry_delay = 120
#dead_letter_queue = "my-queue-dlq"

[[env.production.queues.consumers]]
queue = "ggsbotrs-gateway-queue"
max_batch_size = 10
max_batch_timeout = 0
max_retries = 3
max_concurrency = 10
retry_delay = 5

[[env.production.ratelimits]]
name = "gateway-rate-limiter"
namespace_id = "0"

  [env.production.ratelimits.simple]
  limit = 50
  period = 10

[env.production.observability]
enabled = false
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[env.production.observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[env.production.assets]
directory = "./dist"

# read more about configuring your Worker via wrangler.toml at:
# https://developers.cloudflare.com/workers/cli-wrangler/configuration
